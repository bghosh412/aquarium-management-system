<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0c4a6e">
    <title>Light Schedule - Aquarium Hub</title>
    <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-content">
            <div class="navbar-brand">
                <img src="/images/logo.png" alt="Logo" class="navbar-logo">
                <div>
                    <h1 class="brand-title">Aquarium Hub</h1>
                    <p class="brand-subtitle">Light Schedule</p>
                </div>
            </div>
            <div class="navbar-actions">
                <a href="../../aquarium/aquarium-selection.html" class="btn btn-secondary">
                    <span>←</span> Back
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <h1>Light Schedule</h1>
                <p class="page-description">Configure the lighting schedule for your aquarium</p>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Device Information</h3>
                </div>
                <div class="card-content">
                    <div style="display: flex; flex-wrap: wrap; gap: 2rem; align-items: center;">
                        <div><span>Aquarium:</span> <span style="font-weight: bold;" id="tankName">Aquarium 1</span></div>
                        <div><span>Device Type:</span> <span style="font-weight: bold;" id="deviceType">Lighting</span></div>
                        <div><span>Name:</span> <span style="font-weight: bold;" id="deviceName">Lighting_12</span></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Schedule</h3>
                </div>
                <div class="card-content">
                    <form id="lightScheduleForm">
                        <!-- Morning Photo Period -->
                        <div class="form-group">
                            <h4 style="margin-bottom: 1rem; font-size: 1.1rem; font-weight: 600;">Morning Photo Period</h4>
                            
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
                                <div class="form-group">
                                    <label for="morningStartHour" class="form-label">Start Time</label>
                                    <div style="display: flex; gap: 0.5rem;">
                                        <select id="morningStartHour" class="form-input"></select>
                                        <select id="morningStartMinute" class="form-input"></select>
                                        <select id="morningStartAMPM" class="form-input"></select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="morningDurationHour" class="form-label">Duration</label>
                                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                                        <select id="morningDurationHour" class="form-input"></select>
                                        <span>h</span>
                                        <select id="morningDurationMinute" class="form-input"></select>
                                        <span>m</span>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="morningRamp" class="form-label">Enable Ramp</label>
                                    <select id="morningRamp" class="form-input">
                                        <option value="yes">Yes</option>
                                        <option value="no">No</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <hr style="margin: 2rem 0; border: none; border-top: 1px solid var(--border-color);">

                        <!-- Evening Photo Period -->
                        <div class="form-group">
                            <h4 style="margin-bottom: 1rem; font-size: 1.1rem; font-weight: 600;">Evening Photo Period</h4>
                            
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
                                <div class="form-group">
                                    <label for="eveningStartHour" class="form-label">Start Time</label>
                                    <div style="display: flex; gap: 0.5rem;">
                                        <select id="eveningStartHour" class="form-input"></select>
                                        <select id="eveningStartMinute" class="form-input"></select>
                                        <select id="eveningStartAMPM" class="form-input"></select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="eveningDurationHour" class="form-label">Duration</label>
                                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                                        <select id="eveningDurationHour" class="form-input"></select>
                                        <span>h</span>
                                        <select id="eveningDurationMinute" class="form-input"></select>
                                        <span>m</span>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="eveningRamp" class="form-label">Enable Ramp</label>
                                    <select id="eveningRamp" class="form-input">
                                        <option value="yes">Yes</option>
                                        <option value="no">No</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Submit Buttons -->
                        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                            <button type="submit" class="btn btn-create-aquarium" id="saveScheduleBtn">
                                <span>✓</span> Save
                            </button>
                            <button type="button" class="btn btn-cancel" id="cancelScheduleBtn">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="/scripts/sidebar-inject.js"></script>
    <script>
        // Populate dropdowns for time and duration
        function populateDropdown(id, values, pad = true) {
            const sel = document.getElementById(id);
            sel.innerHTML = '';
            for (let i = 0; i < values.length; i++) {
                let val = values[i];
                let text = pad ? String(val).padStart(2, '0') : val;
                let opt = document.createElement('option');
                opt.value = val;
                opt.textContent = text;
                sel.appendChild(opt);
            }
        }
        
        function populateAMPM(id) {
            const sel = document.getElementById(id);
            sel.innerHTML = '';
            ['AM', 'PM'].forEach(val => {
                let opt = document.createElement('option');
                opt.value = val;
                opt.textContent = val;
                sel.appendChild(opt);
            });
        }
        
        // Morning Start Time: hour (0-11), minute (0,15,30,45), AM/PM
        populateDropdown('morningStartHour', Array.from({length: 12}, (_, i) => i), false);
        populateDropdown('morningStartMinute', [0, 15, 30, 45]);
        populateAMPM('morningStartAMPM');
        populateDropdown('morningDurationHour', Array.from({length: 13}, (_, i) => i), false);
        populateDropdown('morningDurationMinute', [0, 15, 30, 45]);
        
        // Evening Start Time: hour (0-11), minute (0,15,30,45), AM/PM
        populateDropdown('eveningStartHour', Array.from({length: 12}, (_, i) => i), false);
        populateDropdown('eveningStartMinute', [0, 15, 30, 45]);
        populateAMPM('eveningStartAMPM');
        populateDropdown('eveningDurationHour', Array.from({length: 13}, (_, i) => i), false);
        populateDropdown('eveningDurationMinute', [0, 15, 30, 45]);

        // Enforce duration minute options explicitly (fixes deploy/caching edge cases)
        (function enforceDurationMinutes(){
            const minutes = [0,15,30,45];
            ['morningDurationMinute','eveningDurationMinute'].forEach(id => {
                const sel = document.getElementById(id);
                if (!sel) return;
                sel.innerHTML = '';
                minutes.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.textContent = String(m).padStart(2,'0');
                    sel.appendChild(opt);
                });
            });
        })();

        // Button handlers
        let currentDevice = null;

        document.getElementById('saveScheduleBtn').onclick = async function(e) {
            e.preventDefault();
            if (!currentDevice) {
                alert('Device not loaded.');
                return;
            }

            const schedule = buildSchedulePayload();
            const payload = {
                mac: currentDevice.mac,
                tankId: currentDevice.tankId,
                deviceName: currentDevice.name || currentDevice.mac,
                schedule
            };

            try {
                setSaveState(true);
                const resp = await fetch('/api/light-schedule', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await resp.json();
                if (!resp.ok || !data.success) {
                    throw new Error((data && data.error) || 'Save failed');
                }

                // Cache locally for quick reloads
                localStorage.setItem(`lightSchedule:${currentDevice.mac}`, JSON.stringify(payload));
                alert('Schedule saved successfully.');
            } catch (err) {
                console.error('Save failed:', err);
                alert('Failed to save schedule.');
            } finally {
                setSaveState(false);
            }
        };
        
        document.getElementById('cancelScheduleBtn').onclick = function() {
            document.getElementById('lightScheduleForm').reset();
        };

        // Utility: get query string param
        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        // Load device by MAC from API and populate page
        async function loadDeviceFromQuery() {
            const mac = getQueryParam('mac') || localStorage.getItem('selectedDeviceMac');
            if (!mac) {
                alert('No device selected.');
                window.location.href = '../device/manage-devices.html';
                return;
            }

            try {
                const resp = await fetch('/api/devices');
                const data = await resp.json();
                const devices = data.devices || [];
                const device = devices.find(d => d.mac && d.mac.toUpperCase() === mac.toUpperCase());

                if (!device) {
                    console.warn('Device not found:', mac);
                    alert('Device not found. It may have been unmapped or removed.');
                    window.location.href = '../device/manage-devices.html';
                    return;
                }

                // Populate header fields
                document.getElementById('tankName').textContent = `Aquarium ${device.tankId}`;
                document.getElementById('deviceType').textContent = getDeviceTypeLabel(device.type || 'LIGHT');
                document.getElementById('deviceName').textContent = device.name || device.mac;
                currentDevice = device;
                await loadSchedule(mac);

            } catch (err) {
                console.error('Error loading device:', err);
                alert('Failed to load device information.');
            }
        }

        async function loadSchedule(mac) {
            try {
                const resp = await fetch(`/api/light-schedule?mac=${encodeURIComponent(mac)}`);
                const data = await resp.json();
                if (!resp.ok || !data.success) {
                    throw new Error((data && data.error) || 'Failed to load schedule');
                }

                if (data.schedule && data.schedule.schedule) {
                    applySchedule(data.schedule.schedule);
                }
            } catch (err) {
                console.warn('No schedule loaded:', err);
                // Fallback to local cache if available
                const cached = localStorage.getItem(`lightSchedule:${mac}`);
                if (cached) {
                    try {
                        const parsed = JSON.parse(cached);
                        if (parsed && parsed.schedule) {
                            applySchedule(parsed.schedule);
                        }
                    } catch (e) {
                        console.warn('Failed to parse cached schedule:', e);
                    }
                }
            }
        }

        function setSaveState(isSaving) {
            const btn = document.getElementById('saveScheduleBtn');
            btn.disabled = isSaving;
            btn.textContent = isSaving ? 'Saving...' : '✓ Save';
        }

        function applySchedule(schedule) {
            if (schedule.morning) {
                applyTimeToFields('morning', schedule.morning);
            }
            if (schedule.evening) {
                applyTimeToFields('evening', schedule.evening);
            }
        }

        function applyTimeToFields(prefix, section) {
            const start = section.start || { hour: 7, minute: 0 };
            const duration = section.duration || { hour: 1, minute: 0 };
            const ramp = !!section.ramp;

            const converted = to12Hour(start.hour || 0, start.minute || 0);
            document.getElementById(`${prefix}StartHour`).value = converted.hour12;
            document.getElementById(`${prefix}StartMinute`).value = converted.minute;
            document.getElementById(`${prefix}StartAMPM`).value = converted.ampm;

            document.getElementById(`${prefix}DurationHour`).value = duration.hour || 0;
            document.getElementById(`${prefix}DurationMinute`).value = duration.minute || 0;
            document.getElementById(`${prefix}Ramp`).value = ramp ? 'yes' : 'no';
        }

        function buildSchedulePayload() {
            const morning = readSection('morning');
            const evening = readSection('evening');
            return { morning, evening };
        }

        function readSection(prefix) {
            const hour = parseInt(document.getElementById(`${prefix}StartHour`).value, 10) || 0;
            const minute = parseInt(document.getElementById(`${prefix}StartMinute`).value, 10) || 0;
            const ampm = document.getElementById(`${prefix}StartAMPM`).value || 'AM';
            const durationHour = parseInt(document.getElementById(`${prefix}DurationHour`).value, 10) || 0;
            const durationMinute = parseInt(document.getElementById(`${prefix}DurationMinute`).value, 10) || 0;
            const ramp = document.getElementById(`${prefix}Ramp`).value === 'yes';

            const hour24 = to24Hour(hour, ampm);
            return {
                start: { hour: hour24, minute },
                duration: { hour: durationHour, minute: durationMinute },
                ramp
            };
        }

        function to24Hour(hour12, ampm) {
            let h = hour12 % 12;
            if (ampm === 'PM') h += 12;
            return h;
        }

        function to12Hour(hour24, minute) {
            let ampm = hour24 >= 12 ? 'PM' : 'AM';
            let h = hour24 % 12;
            if (h === 0) h = 12;
            return { hour12: h, minute: minute || 0, ampm };
        }

        function getDeviceTypeLabel(type) {
            const t = String(type || '').toLowerCase();
            switch (t) {
                case 'light': return 'Lighting';
                case 'co2': return 'CO₂ Regulator';
                case 'heater': return 'Heater';
                case 'fish_feeder': return 'Fish Feeder';
                case 'sensor': return 'Water Quality Sensor';
                case 'repeater': return 'Repeater';
                default: return 'Unknown';
            }
        }

        // Load device when page is ready
        document.addEventListener('DOMContentLoaded', () => {
            loadDeviceFromQuery();
        });
    </script>
</body>
</html>
