; PlatformIO Project Configuration File - Aquarium Management System
;
; This project contains multiple firmware targets:
; - hub_esp32: Central controller (ESP32-S3-N16R8)
; - node_fish_feeder: Fish feeder controller (ESP8266)
; - node_co2_regulator: CO2 regulator controller (ESP8266)
; - node_lighting: Lighting controller (ESP8266)
; - node_heater: Heater controller (ESP8266)
; - node_water_quality: Water quality sensors (ESP8266)
; - node_repeater: ESP-NOW range extender (ESP8266)
;
; Build specific target: pio run -e hub_esp32
; Upload specific target: pio run -e hub_esp32 -t upload

; ============================================================================
; SHARED CONFIGURATION
; ============================================================================
[platformio]
; Shared protocol definitions
include_dir = include
; All environments use src/ as base directory
src_dir = src

[common]
monitor_speed = 115200
build_flags = 
    -DESPNOW_CHANNEL=11
    -I include

[common_esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = 115200
build_flags = 
    ${common.build_flags}
    -DNODE_BUILD
lib_deps = 
    bblanchon/ArduinoJson@^7.2.0

; ============================================================================
; HUB - ESP32-S3 (Central Controller)
; ============================================================================
; DUAL LITTLEFS PARTITION ARCHITECTURE:
; - static_fs (7MB): UI files (HTML/CSS/JS), hub_config.txt - OTA updateable
; - user_fs (~3MB):  User data (JSON files) - PRESERVED during LittleFS OTA
;
; Build targets for VS Code PlatformIO widget:
;   hub_esp32          - Main hub firmware
;   hub_esp32_staticfs - Build/upload static filesystem (UI + hub_config)
;   hub_esp32_userfs   - Build/upload user data filesystem (JSON files)
; ============================================================================

[common_hub]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = ${common.monitor_speed}
monitor_port = /dev/ttyACM0
upload_speed = 921600
upload_port = /dev/ttyACM0
board_build.filesystem = littlefs
board_build.flash_size = 16MB
board_build.partitions = partitions/dual_littlefs_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
lib_extra_dirs = /home/pi/Desktop/MicroCore/lib
lib_deps = 
    tzapu/WiFiManager@^2.0.17
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    bblanchon/ArduinoJson@^7.2.0 
    ESPmDNS

; ----------------------------------------------------------------------------
; Main Hub Firmware
; ----------------------------------------------------------------------------
[env:hub_esp32]
extends = common_hub
extra_scripts = 
    pre:tools/set_data_dir.py
build_src_filter = +<*> -<nodes/>
build_flags = 
    ${common.build_flags}
    -DHUB_BUILD
    -DDUAL_LITTLEFS                    ; Enable dual filesystem support
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Os
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=1
    -DASYNCWEBSERVER_REGEX
    -DBOARD_HAS_PSRAM

; ----------------------------------------------------------------------------
; Static Filesystem (UI + hub_config) - For OTA updates
; Build FS:  pio run -e hub_esp32_staticfs -t buildfs
; Upload FS: pio run -e hub_esp32_staticfs -t uploadfs
; ----------------------------------------------------------------------------
[env:hub_esp32_staticfs]
extends = common_hub
extra_scripts = 
    pre:tools/set_static_data_dir.py
    post:tools/build_static_fs.py
    post:tools/cleanup_buildfs_temp.py
build_src_filter = +<fs_stub.cpp> -<*>
board_build.partitions = partitions/dual_littlefs_16MB.csv
targets = buildfs

; ----------------------------------------------------------------------------
; User Data Filesystem (JSON files) - Preserve during OTA
; Build FS:  pio run -e hub_esp32_userfs -t buildfs
; Upload FS: pio run -e hub_esp32_userfs -t uploadfs  
; ----------------------------------------------------------------------------
[env:hub_esp32_userfs]
extends = common_hub
extra_scripts = 
    pre:tools/set_user_data_dir.py
    post:tools/build_user_fs.py
    post:tools/cleanup_buildfs_temp.py
build_src_filter = +<fs_stub.cpp> -<*>
board_build.partitions = partitions/dual_littlefs_16MB.csv
targets = buildfs
; ============================================================================
; NODES - ESP8266 (Peripheral Controllers)
; ============================================================================

; ----------------------------------------------------------------------------
; Fish Feeder Node (ESP32-WROOM)
; ----------------------------------------------------------------------------
[env:node_fish_feeder]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = 921600
extra_scripts = pre:tools/set_data_dir.py

; Only compile fish feeder node files
build_src_filter = +<nodes/fish_feeder/src/> -<nodes/co2_regulator/> -<nodes/lighting/> -<nodes/heater/> -<nodes/water_quality/> -<nodes/repeater/> -<nodes/wave_maker/> -<main.cpp>

build_flags = 
    ${common.build_flags}
    -DNODE_BUILD
    -DNODE_TYPE_FISH_FEEDER

lib_deps = 
    bblanchon/ArduinoJson@^7.2.0
    madhephaestus/ESP32Servo@^3.0.5

; ----------------------------------------------------------------------------
; CO2 Regulator Node (ESP8266 D1 Mini)
; pH-based CO2 injection control with DFRobot analog pH sensor + relay
; ----------------------------------------------------------------------------
