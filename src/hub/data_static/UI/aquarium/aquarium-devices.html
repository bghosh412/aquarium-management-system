<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0c4a6e">
    <title>Aquarium Devices - Aquarium Hub</title>
    <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-content">
            <div class="navbar-brand">
                <img src="/images/logo.png" alt="Logo" class="navbar-logo">
                <div>
                    <h1 class="brand-title">Aquarium Hub</h1>
                    <p class="brand-subtitle">Aquarium Devices</p>
                </div>
            </div>
            <div class="navbar-actions">
                <a href="aquarium-selection.html" class="btn btn-secondary">
                    <span>←</span> Back
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Sidebar will be injected here -->
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <h1 id="aquariumTitle">Aquarium Devices</h1>
                <p class="page-description">View and manage devices for this aquarium</p>
            </div>

            <!-- Aquarium Details Card -->
            <div class="card" style="margin-bottom: 1.5rem;">
                <div class="card-header">
                    <h3 id="aquariumName">Aquarium</h3>
                    <span class="badge" id="aquariumStatusBadge">Active</span>
                </div>
                <div class="card-body">
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                        <div>
                            <div style="color: var(--color-text-secondary); font-size: 0.75rem;">Tank ID</div>
                            <div style="font-weight: 600; font-size: 1.25rem;" id="aquariumTankId">-</div>
                        </div>
                        <div>
                            <div style="color: var(--color-text-secondary); font-size: 0.75rem;">Volume</div>
                            <div style="font-weight: 600; font-size: 1.25rem;" id="aquariumVolume">-</div>
                        </div>
                        <div>
                            <div style="color: var(--color-text-secondary); font-size: 0.75rem;">Devices</div>
                            <div style="font-weight: 600; font-size: 1.25rem;" id="aquariumDeviceCount">-</div>
                        </div>
                    </div>

                    <div id="aquariumLocation" style="color: var(--color-text-secondary); font-size: 0.875rem; margin-top: 1rem; display: none;">
                        📍 <span id="aquariumLocationText"></span>
                    </div>
                </div>
                <div class="card-footer" style="display: flex; gap: 0.5rem;">
                    <button class="btn btn-secondary" onclick="editAquarium()" style="flex: 1;">
                        ⚙️ Edit Aquarium
                    </button>
                </div>
            </div>

            <!-- Offline Devices Warning -->
            <div id="offlineWarning" class="card" style="margin-bottom: 1.5rem; display: none; border: 2px solid var(--color-accent-danger);">
                <div class="card-body" style="display: flex; align-items: center; justify-content: space-between; gap: 1rem;">
                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                        <div style="font-size: 1.5rem;">⚠️</div>
                        <div>
                            <div style="font-weight: 600;">Offline Devices</div>
                            <div style="color: var(--color-text-secondary); font-size: 0.875rem;">Click to filter offline devices</div>
                        </div>
                    </div>
                    <button class="btn btn-danger" onclick="showOfflineDevices()" id="offlineCountBtn">
                        <span id="offlineDeviceCount">0</span> Offline
                    </button>
                </div>
            </div>

            <!-- Filter Section -->
            <div class="card" style="margin-bottom: 1.5rem;">
                <div class="card-body">
                    <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
                        <div style="flex: 1; min-width: 200px;">
                            <label for="statusFilter" class="form-label" style="margin-bottom: 0.5rem;">Filter by Status</label>
                            <select id="statusFilter" class="form-input" onchange="filterDevices()">
                                <option value="all">All Status</option>
                                <option value="online">Online</option>
                                <option value="offline">Offline</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Devices Grid -->
            <div class="content-grid" id="devicesGrid">
                <!-- Devices will be dynamically loaded here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="card" style="display: none; text-align: center; padding: 3rem;">
                <div style="font-size: 4rem; margin-bottom: 1rem;">🔌</div>
                <h2>No Devices Found</h2>
                <p style="color: var(--color-text-secondary); margin: 1rem 0 2rem;">
                    No devices match your current filter for this aquarium.
                </p>
                <a href="../device/manage-devices.html" class="btn btn-primary">
                    <span>🔌</span> Manage All Devices
                </a>
            </div>
        </main>
    </div>

    <script src="../scripts/app.js"></script>
    <script src="../scripts/aquarium-devices.js"></script>
    <script src="../scripts/sidebar-inject.js"></script>
</body>
</html>
